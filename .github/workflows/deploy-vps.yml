# Bravo V6.0 — VPS deploy workflow
#
# On push to main: run tests, SSH to VPS, git pull + docker compose rebuild,
# smoke-test, notify Telegram. Rollback is a manual `git reset --hard <sha>`
# + re-run of the SSH step.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST            — e.g. ops.oasisai.work
#   VPS_USER            — e.g. bravo
#   VPS_SSH_PRIVATE_KEY — PEM key (passphrase-less, 4096-bit ED25519)
#   TELEGRAM_BOT_TOKEN  — for deploy notification
#   TELEGRAM_CHAT_ID    — CC's personal chat ID

name: deploy-vps

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "brain/**"
      - "skills/**"
      - "infra/**"
      - "requirements.txt"
      - "scripts/scheduler.py"
      - "telegram_agent.js"
      - "coordination_agent.js"
      - "ecosystem.config.js"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Security gates run BEFORE functional tests so they stay active even if a
      # functional test flakes — security scanning is a separate concern from the
      # test suite and must not be silently skipped behind a red test.
      - name: Security Audit - Dependencies
        run: |
          pip install pip-audit
          # Blocking gate: any known CVE in a pinned dependency fails the build
          # (requirements.txt is clean as of 2026-06-21 — all 11 prior CVEs fixed).
          pip-audit -r requirements.txt
      - name: Security Audit - Skills
        # 'scan' subcommand is required — a bare invocation just prints help and
        # exits 0 (a no-op gate). 'scan' exits 1 only on CRITICAL_FINDINGS
        # (hardcoded_credential / missing_outbound_gate), which must block deploy.
        run: python scripts/skill_spector.py scan
      - name: Run tests
        run: python -m pytest tests/ scripts/ -q --ignore=scripts/test_send_gateway.py --ignore=scripts/test_csuite_pulse_flow.py
      - name: Self audit
        run: python scripts/core/self_audit.py
        continue-on-error: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check VPS deploy secrets
        id: deploy_secrets
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || \
             [ -z "${{ secrets.VPS_USER }}" ] || \
             [ -z "${{ secrets.VPS_SSH_PRIVATE_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS deploy secrets are not configured; skipping SSH deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.deploy_secrets.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        if: steps.deploy_secrets.outputs.configured == 'true'
        id: deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -eo pipefail; \
             cd /srv/bravo && \
             git fetch origin main && \
             PRIOR_SHA=\$(git rev-parse HEAD) && \
             git reset --hard origin/main && \
             NEW_SHA=\$(git rev-parse HEAD) && \
             docker compose -f infra/docker-compose.yml --env-file .env.agents up -d --build && \
             echo \"PRIOR=\$PRIOR_SHA NEW=\$NEW_SHA\""

      - name: Smoke test — webhook healthz
        if: steps.deploy_secrets.outputs.configured == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${{ secrets.VPS_HOST }}/healthz" | grep -q "ok"; then
              echo "healthz ok"; exit 0
            fi
            echo "waiting for healthz… ($i/6)"; sleep 10
          done
          echo "healthz failed after 60s"; exit 1

      - name: Notify Telegram — success
        if: success() && steps.deploy_secrets.outputs.configured == 'true'
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::notice::Telegram deploy notification secrets are not configured; skipping notification."
            exit 0
          fi
          curl -fsS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ bravo VPS deploy succeeded (${GITHUB_SHA:0:7})"

      - name: Notify Telegram — failure
        if: failure() && steps.deploy_secrets.outputs.configured == 'true'
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::notice::Telegram deploy notification secrets are not configured; skipping notification."
            exit 0
          fi
          curl -fsS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ bravo VPS deploy FAILED on ${GITHUB_SHA:0:7} — check Actions"
