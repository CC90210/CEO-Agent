# Bravo V6.0 — VPS deploy workflow
#
# On push to main: run tests, SSH to VPS, git pull + docker compose rebuild,
# smoke-test, notify Telegram. Rollback is a manual `git reset --hard <sha>`
# + re-run of the SSH step.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST            — e.g. ops.oasisai.work
#   VPS_USER            — e.g. bravo
#   VPS_SSH_PRIVATE_KEY — PEM key (passphrase-less, 4096-bit ED25519)
#   TELEGRAM_BOT_TOKEN  — for deploy notification
#   TELEGRAM_CHAT_ID    — CC's personal chat ID

name: deploy-vps

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "brain/**"
      - "skills/**"
      - "infra/**"
      - "requirements.txt"
      - "scheduler.py"
      - "telegram_agent.js"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run send_gateway tests
        run: python -m pytest scripts/test_send_gateway.py -q
      - name: Self audit
        run: python scripts/self_audit.py
        continue-on-error: false

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        id: deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "set -eo pipefail; \
             cd /srv/bravo && \
             git fetch origin main && \
             PRIOR_SHA=\$(git rev-parse HEAD) && \
             git reset --hard origin/main && \
             NEW_SHA=\$(git rev-parse HEAD) && \
             docker compose -f infra/docker-compose.yml --env-file .env.agents up -d --build && \
             echo \"PRIOR=\$PRIOR_SHA NEW=\$NEW_SHA\""

      - name: Smoke test — webhook healthz
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://${{ secrets.VPS_HOST }}/healthz" | grep -q "ok"; then
              echo "healthz ok"; exit 0
            fi
            echo "waiting for healthz… ($i/6)"; sleep 10
          done
          echo "healthz failed after 60s"; exit 1

      - name: Notify Telegram — success
        if: success()
        run: |
          curl -fsS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ bravo VPS deploy succeeded (${GITHUB_SHA:0:7})"

      - name: Notify Telegram — failure
        if: failure()
        run: |
          curl -fsS "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=❌ bravo VPS deploy FAILED on ${GITHUB_SHA:0:7} — check Actions"
