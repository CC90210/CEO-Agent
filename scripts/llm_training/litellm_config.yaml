model_list:
  - model_name: bravo-custom-llm
    litellm_params:
      model: ollama/bravo-qwen14b
      api_base: http://localhost:11434
      temperature: 0.7

router_settings:
  routing_strategy: lowest-latency
  num_retries: 2
  timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  alerting: []
  drop_params: true

# `os.environ/NAME` is LiteLLM's own indirection — the proxy reads the value from
# the environment at startup. A literal key here would be readable by anyone with
# repo access and would grant them the admin/key-generation endpoints.
# Set it before starting the proxy:
#   export LITELLM_MASTER_KEY=<value from .env.agents>
#
# Custom API Keys can be generated via CLI or admin API:
# litellm --config litellm_config.yaml --port 4000
# curl -X POST 'http://localhost:4000/key/generate' \
#   -H "Authorization: Bearer $LITELLM_MASTER_KEY" -d '{"models": ["bravo-custom-llm"]}'
