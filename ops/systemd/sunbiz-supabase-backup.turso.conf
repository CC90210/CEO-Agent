# Turso is the data plane (2026-08-09 cutover).
#
# Without this, lib/secret_loader's routing synthesis does not fire AND the
# venv's empire_turso_switch .pth does not install the compat client, so the
# backup tries to reach the cancelled Supabase project and exits FATAL before
# writing an artifact. That is what happened on 2026-08-11 and 2026-08-12.
#
# With it, the same export code opens Turso (tables) and R2 (storage objects),
# i.e. it backs up the database that is actually live.
[Service]
Environment=EMPIRE_DATA_BACKEND=turso_cloud
